<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Table design harness</title>
  <!-- Same Google Fonts link as game/index.html so type is reviewed with the real fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Hanken+Grotesk:wght@400;600&display=swap">
  <!-- Real stylesheets: any CSS change shows up here automatically. -->
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/table.css">
  <link rel="stylesheet" href="../styles/table-responsive.css">
  <style>
    .harness-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: #1b1b1b;
      color: #f5d76e;
      font: 600 11px/1.2 system-ui, sans-serif;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 50;
    }
    .harness-bar__label { text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
    .harness-bar a {
      color: #fff;
      text-decoration: none;
      padding: 2px 7px;
      border: 1px solid #555;
      border-radius: 999px;
      font-weight: 400;
    }
    .harness-bar a[aria-current="page"] { background: #f5d76e; color: #1b1b1b; border-color: #f5d76e; }
    .harness-bar a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .harness-error { padding: 16px; color: #b00020; font: 14px system-ui, sans-serif; }
  </style>
  <!-- Redirect the network-backed API module to an offline stub. The real UI modules are untouched. -->
  <script type="importmap">
    { "imports": { "../lib/poker-api.js": "./poker-api-stub.js" } }
  </script>
</head>
<body data-active-view="table">
  <div class="harness-bar" id="harness-bar" role="navigation" aria-label="Design harness states">
    <span class="harness-bar__label">Design harness · mock data</span>
  </div>
  <main class="game-main wrap" id="main-content"></main>
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="./harness.js"></script>
</body>
</html>
