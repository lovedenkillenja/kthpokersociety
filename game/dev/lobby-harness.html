<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Lobby design harness</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Hanken+Grotesk:wght@400;600&display=swap">
  <!-- Real stylesheets: any CSS change shows up here automatically. -->
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/table.css">
  <link rel="stylesheet" href="../styles/table-responsive.css">
  <style>
    .harness-bar {
      display: flex; align-items: center; gap: 6px; padding: 3px 8px;
      background: #1b1b1b; color: #f5d76e; font: 600 11px/1.2 system-ui, sans-serif;
      overflow-x: auto; white-space: nowrap;
    }
    .harness-bar__label { text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
    .harness-bar a { color: #fff; text-decoration: none; padding: 2px 7px; border: 1px solid #555; border-radius: 999px; font-weight: 400; }
    .harness-bar a[aria-current="page"] { background: #f5d76e; color: #1b1b1b; border-color: #f5d76e; }
    .harness-error { padding: 16px; color: #ff9b8f; font: 14px system-ui, sans-serif; }
  </style>
  <!-- The real app.js runs unchanged; only its two network modules are replaced by offline mock-data stubs. -->
  <script type="importmap">
    { "imports": {
      "../lib/supabase.js": "./lobby-supabase-stub.js",
      "../lib/poker-api.js": "./lobby-poker-api-stub.js"
    } }
  </script>
</head>
<body>
  <div class="harness-bar" id="harness-bar" role="navigation" aria-label="Design harness views">
    <span class="harness-bar__label">Design harness · mock data</span>
  </div>
  <div id="harness-root"></div>
  <script type="module" src="./lobby-harness.js"></script>
</body>
</html>
