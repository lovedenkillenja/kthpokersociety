[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The chip game is not public yet: /game and everything under it is behind a server-side dev code
# (Netlify env vars DEV_CODE and DEV_COOKIE_SECRET, see netlify/edge-functions/game-gate.js).
# To launch the game: delete the edge function file and this block.
[[edge_functions]]
  function = "game-gate"
  path = "/game"

[[edge_functions]]
  function = "game-gate"
  path = "/game/*"
