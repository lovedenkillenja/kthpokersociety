[build]
  publish = "."

# Security headers for every response.
# CSP notes:
# - script-src needs 'unsafe-inline' because the root index.html has inline <script> blocks.
#   Follow-up: replace it with sha256 hashes (or move the scripts to files) once index.html is stable.
# - style-src needs 'unsafe-inline' for inline <style> blocks and style="" attributes
#   (root page, game page and the game-gate page).
# - supabase-js is allowed only from its pinned version path on jsDelivr (and the tags carry SRI).
# - connect-src lists both Supabase projects for REST/Auth/Edge Functions (https) and Realtime (wss).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://tibyyjnghhwwcxvlwmiq.supabase.co wss://tibyyjnghhwwcxvlwmiq.supabase.co https://hrdqlaurdzyueviplbmj.supabase.co wss://hrdqlaurdzyueviplbmj.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=(), fullscreen=(self)"

# The chip game is not public yet: /game and everything under it is behind a server-side dev code
# (Netlify env vars DEV_CODE and DEV_COOKIE_SECRET, see netlify/edge-functions/game-gate.js).
# To launch the game: delete the edge function file and this block.
[[edge_functions]]
  function = "game-gate"
  path = "/game"

[[edge_functions]]
  function = "game-gate"
  path = "/game/*"

# Do not serve repository files that are not part of the site.
# Forced 404 rewrites: they win over existing files. /game/engine/* is NOT blocked
# (shared engine code; keep it reachable). Edge functions run before redirects, so the
# game gate still handles /game/* first.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
